        unique_id: wazuh_source_synology_24h
        unit_of_measurement: "events"
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('sources', {}).get('synology', {}).get('doc_count') is not none }}
        value_template: >-
          {{ value_json.get('aggregations', {}).get('adapter_v1', {}).get('sources', {}).get('synology', {}).get('doc_count', 0) | int(0) }}
        json_attributes_path: "$.aggregations.adapter_v1.sources.synology"
        json_attributes:
          - elevated
          - high
          - latest

template:
  - sensor:
      - name: "SIEM Security Score"
        unique_id: siem_security_score
        unit_of_measurement: "%"
        availability: >-
          {{ has_value('sensor.wazuh_critical_24h')
             and has_value('sensor.wazuh_high_24h')
             and has_value('sensor.wazuh_medium_24h') }}
        state: >-
          {% set critical = states('sensor.wazuh_critical_24h') | int(0) %}
          {% set high = states('sensor.wazuh_high_24h') | int(0) %}
          {% set medium = states('sensor.wazuh_medium_24h') | int(0) %}
          {% set penalty = 40 if critical > 0 else 0 %}
          {% set penalty = penalty + (20 if high > 2500 else 10 if high > 1500 else 0) %}
          {% set penalty = penalty + (10 if medium > 20 else 5 if medium > 10 else 0) %}
          {{ 100 - penalty }}

recorder:
  exclude:
    entities:
      - sensor.wazuh_security_last_5
      - sensor.wazuh_safeline_last_attack
      - sensor.wazuh_ugreen_last_event
      - sensor.wazuh_source_unifi_24h
      - sensor.wazuh_source_safeline_24h
      - sensor.wazuh_source_ugreen_24h
      - sensor.wazuh_source_home_assistant_24h
      - sensor.wazuh_source_synology_24h
