# Example source address. Replace 192.0.2.30 with the UGREEN NAS address.
# The shared rsyslog input must already own UDP/514; do not add another listener.
if ($fromhost-ip == '192.0.2.30') then {
    action(
        type="omfile"
        file="/var/log/ugreen.log"
        fileOwner="syslog"
        fileGroup="adm"
        fileCreateMode="0640"
    )
    stop
}
