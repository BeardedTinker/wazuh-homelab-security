[SERVICE]
    Flush                     1
    Grace                     30
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    storage.path              /fluent-bit/state/buffers
    storage.sync              normal
    storage.checksum          on
    storage.backlog.mem_limit 8M

[INPUT]
    Name              tail
    Tag               ugreen.auth
    Path              /host/var/log/auth.log
    Parser            ugos_syslog_rfc3164
    DB                /fluent-bit/state/auth.db
    Read_from_Head    off
    Refresh_Interval  5
    Skip_Long_Lines   on
    storage.type      filesystem

[FILTER]
    Name   grep
    Match  ugreen.auth
    Regex  ident ^(sshd|groupadd|useradd|passwd)$
    Regex  message (Accepted (password|publickey)|Failed (password|publickey)|Invalid user|new group:|new user:|password changed for)

[INPUT]
    Name              tail
    Tag               ugreen.kernel
    Path              /host/var/log/kern.log
    Parser            ugos_syslog_rfc3164
    DB                /fluent-bit/state/kernel.db
    Read_from_Head    off
    Refresh_Interval  5
    Skip_Long_Lines   on
    storage.type      filesystem

[FILTER]
    Name   grep
    Match  ugreen.kernel
    Regex  ident ^kernel$
    Regex  message I/O error, dev [A-Za-z0-9._/-]+,

[INPUT]
    Name              systemd
    Tag               ugreen.log_serv
    Systemd_Filter    _COMM=log_serv
    Read_From_Tail    on
    DB                /fluent-bit/state/log-serv.db
    Strip_Underscores on
    storage.type      filesystem

[FILTER]
    Name   modify
    Match  ugreen.log_serv
    Rename MESSAGE message
    Rename HOSTNAME host
    Rename COMM ident

[FILTER]
    Name   grep
    Match  ugreen.log_serv
    Regex  message insertLog login User \[[^]]*\] from \[[0-9a-fA-F:.]+\] (logged in successfully|failed to log in due to)

[OUTPUT]
    Name                 syslog
    Match                ugreen.*
    Host                 192.0.2.39
    Port                 514
    Mode                 udp
    Syslog_Format        rfc3164
    Syslog_Maxsize       2048
    Syslog_Hostname_Key  host
    Syslog_Appname_Key   ident
    Syslog_Message_Key   message
