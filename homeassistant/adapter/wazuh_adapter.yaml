      - name: "Wazuh SafeLine Top Source IP 24h"
        unique_id: wazuh_safeline_top_source_ip_24h
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('top_srcip', {}).get('buckets') is not none }}
        value_template: >-
          {% set buckets = value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('top_srcip', {}).get('buckets', []) %}
          {% if buckets | length > 0 %}
            {{ buckets[0].key }} ({{ buckets[0].doc_count }}x)
          {% else %}
            n/a
          {% endif %}
      - name: "Wazuh SafeLine Last Attack"
        unique_id: wazuh_safeline_last_attack
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('latest', {}).get('hits', {}).get('hits') is not none }}
        value_template: >-
          {% set hits = value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('latest', {}).get('hits', {}).get('hits', []) %}
          {{ hits[0]._source['@timestamp'] if hits | length > 0 else 'n/a' }}
        json_attributes_path: "$.aggregations.adapter_v1.safeline.latest.hits"
        json_attributes:
          - hits

  - resource: !secret wazuh_indexer_search_url
    method: POST
    authentication: basic
    verify_ssl: true
    timeout: 30
    username: !secret wazuh_indexer_username
    password: !secret wazuh_indexer_password
    headers:
      Content-Type: application/json
    scan_interval: 300
    payload: >-
      {
        "size": 0,
        "track_total_hits": false,
        "aggs": {
          "adapter_v1": {
            "filter": {
              "range": {
                "@timestamp": {"gte": "now-24h", "lt": "now"}
              }
            },
            "aggs": {
              "critical": {"filter": {"range": {"rule.level": {"gte": 15}}}},
              "high": {"filter": {"range": {"rule.level": {"gte": 12, "lte": 14}}}},
              "medium": {"filter": {"range": {"rule.level": {"gte": 7, "lte": 11}}}},
              "low": {"filter": {"range": {"rule.level": {"lte": 6}}}},
              "top_elevated_rule": {
                "filter": {"range": {"rule.level": {"gte": 7}}},
                "aggs": {
                  "rules": {
                    "terms": {"field": "rule.id.keyword", "size": 1},
                    "aggs": {
                      "sample": {
                        "top_hits": {
                          "size": 1,
                          "_source": ["rule.id", "rule.description"]
                        }
                      }
                    }
                  }
                }
              },
              "wan_local": {
                "filter": {
                  "term": {"decoder.name.keyword": "unifi-wan-local"}
                },
                "aggs": {
                  "top_srcip": {
                    "terms": {"field": "data.srcip.keyword", "size": 1}
                  },
                  "top_dstport": {
                    "terms": {"field": "data.dstport.keyword", "size": 1}
                  }
                }
              },
              "ugreen": {
                "filter": {
                  "term": {"location.keyword": "/var/log/ugreen.log"}
                },
                "aggs": {
                  "web_success": {
                    "filter": {"terms": {"rule.id.keyword": ["100600", "100611"]}}
                  },
                  "web_failures": {
                    "filter": {"terms": {"rule.id.keyword": ["100601", "100610"]}}
                  },
                  "ssh_success": {
                    "filter": {"term": {"rule.id.keyword": "5715"}}
                  },
                  "account_changes": {
                    "filter": {"terms": {"rule.id.keyword": ["5901", "5902", "100620"]}}
                  },
                  "storage_alerts": {
                    "filter": {"terms": {"rule.id.keyword": ["100630", "100631"]}}
                  },
                  "top_srcip": {
                    "terms": {"field": "data.srcip.keyword", "size": 1}
                  },
                  "latest": {
                    "top_hits": {
                      "size": 1,
                      "sort": [{"@timestamp": {"order": "desc"}}],
                      "_source": [
                        "@timestamp", "rule.id", "rule.level", "rule.description",
                        "decoder.name", "location", "data.srcip", "data.dstuser",
                        "data.storage_device"
                      ]
                    }
                  }
                }
              },
              "sources": {
                "filter": {"match_all": {}},
                "aggs": {
                  "unifi": {
                    "filter": {"term": {"rule.groups.keyword": "unifi"}},
                    "aggs": {
                      "elevated": {"filter": {"range": {"rule.level": {"gte": 7}}}},
                      "high": {"filter": {"range": {"rule.level": {"gte": 12}}}},
                      "latest": {
                        "top_hits": {
                          "size": 1,
                          "sort": [{"@timestamp": {"order": "desc"}}],
                          "_source": ["@timestamp", "rule.id", "rule.level", "rule.description"]
                        }
                      }
                    }
                  },
                  "safeline": {
                    "filter": {"term": {"rule.groups.keyword": "safeline_waf_event"}},
                    "aggs": {
                      "elevated": {"filter": {"range": {"rule.level": {"gte": 7}}}},
                      "high": {"filter": {"range": {"rule.level": {"gte": 12}}}},
                      "latest": {
                        "top_hits": {
                          "size": 1,
                          "sort": [{"@timestamp": {"order": "desc"}}],
                          "_source": ["@timestamp", "rule.id", "rule.level", "rule.description"]
                        }
                      }
                    }
                  },
                  "ugreen": {
                    "filter": {"term": {"location.keyword": "/var/log/ugreen.log"}},
                    "aggs": {
                      "elevated": {"filter": {"range": {"rule.level": {"gte": 7}}}},
                      "high": {"filter": {"range": {"rule.level": {"gte": 12}}}},
                      "latest": {
                        "top_hits": {
                          "size": 1,
                          "sort": [{"@timestamp": {"order": "desc"}}],
                          "_source": ["@timestamp", "rule.id", "rule.level", "rule.description"]
                        }
                      }
                    }
                  },
                  "home_assistant": {
                    "filter": {"term": {"rule.groups.keyword": "homeassistant"}},
                    "aggs": {
                      "elevated": {"filter": {"range": {"rule.level": {"gte": 7}}}},
                      "high": {"filter": {"range": {"rule.level": {"gte": 12}}}},
                      "latest": {
                        "top_hits": {
                          "size": 1,
                          "sort": [{"@timestamp": {"order": "desc"}}],
                          "_source": ["@timestamp", "rule.id", "rule.level", "rule.description"]
                        }
                      }
                    }
                  },
                  "synology": {
                    "filter": {"term": {"rule.groups.keyword": "synology"}},
                    "aggs": {
                      "elevated": {"filter": {"range": {"rule.level": {"gte": 7}}}},
                      "high": {"filter": {"range": {"rule.level": {"gte": 12}}}},
                      "latest": {
                        "top_hits": {
                          "size": 1,
                          "sort": [{"@timestamp": {"order": "desc"}}],
                          "_source": ["@timestamp", "rule.id", "rule.level", "rule.description"]
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    sensor:
      - name: "Wazuh Critical 24h"
        unique_id: wazuh_critical_24h
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('critical', {}).get('doc_count') is not none }}
