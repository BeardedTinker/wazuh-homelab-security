# Optional Wazuh Indexer presentation adapter for Home Assistant.
# See README.md and CONTRACT.md before installation.

rest:
  - resource: !secret wazuh_indexer_search_url
    method: POST
    authentication: basic
    verify_ssl: true
    timeout: 30
    username: !secret wazuh_indexer_username
    password: !secret wazuh_indexer_password
    headers:
      Content-Type: application/json
    scan_interval: 120
    payload: >-
      {
        "size": 0,
        "track_total_hits": false,
        "aggs": {
          "adapter_v1": {
            "filter": {
              "range": {
                "@timestamp": {"gte": "now-24h", "lt": "now"}
              }
            },
            "aggs": {
              "security": {
                "filter": {"range": {"rule.level": {"gte": 10}}},
                "aggs": {
                  "latest": {
                    "top_hits": {
                      "size": 5,
                      "sort": [{"@timestamp": {"order": "desc"}}],
                      "_source": [
                        "@timestamp", "rule.id", "rule.level", "rule.description",
                        "agent.name", "decoder.name", "location"
                      ]
                    }
                  }
                }
              },
              "safeline": {
                "filter": {
                  "term": {"rule.groups.keyword": "safeline_waf_event"}
                },
                "aggs": {
                  "blocked": {"filter": {"term": {"data.action.keyword": "1"}}},
                  "sqli": {"filter": {"term": {"data.attack_type.keyword": "0"}}},
                  "xss": {"filter": {"term": {"data.attack_type.keyword": "1"}}},
                  "repeated": {"filter": {"term": {"rule.id.keyword": "100550"}}},
                  "multi_vector": {"filter": {"term": {"rule.id.keyword": "100551"}}},
                  "top_srcip": {
                    "terms": {"field": "data.srcip.keyword", "size": 1}
                  },
                  "latest": {
                    "top_hits": {
                      "size": 1,
                      "sort": [{"@timestamp": {"order": "desc"}}],
                      "_source": [
                        "@timestamp", "rule.id", "rule.level", "rule.description",
                        "data.event_id", "data.srcip", "data.action", "data.action_name",
                        "data.attack_type", "data.attack_type_name", "data.module",
                        "data.rule_id", "data.host", "data.path_only"
                      ]
                    }
                  }
                }
              }
            }
          }
        }
      }
    sensor:
      - name: "Wazuh Indexer Last Successful Poll"
        unique_id: wazuh_indexer_last_successful_poll
        device_class: timestamp
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1') is not none }}
        value_template: "{{ now().isoformat() }}"
      - name: "Wazuh Security Last 5"
        unique_id: wazuh_security_last_5
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('security', {}).get('latest', {}).get('hits', {}).get('hits') is not none }}
        value_template: >-
          {{ value_json.get('aggregations', {}).get('adapter_v1', {}).get('security', {}).get('latest', {}).get('hits', {}).get('hits', []) | length }}
        json_attributes_path: "$.aggregations.adapter_v1.security.latest.hits"
        json_attributes:
          - hits
      - name: "Wazuh SafeLine Alerts 24h"
        unique_id: wazuh_safeline_alerts_24h
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('doc_count') is not none }}
        value_template: >-
          {{ value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('doc_count', 0) | int(0) }}
      - name: "Wazuh SafeLine Blocked Attacks 24h"
        unique_id: wazuh_safeline_blocked_attacks_24h
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('blocked', {}).get('doc_count') is not none }}
        value_template: >-
          {{ value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('blocked', {}).get('doc_count', 0) | int(0) }}
      - name: "Wazuh SafeLine SQLi 24h"
        unique_id: wazuh_safeline_sqli_24h
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('sqli', {}).get('doc_count') is not none }}
        value_template: >-
          {{ value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('sqli', {}).get('doc_count', 0) | int(0) }}
      - name: "Wazuh SafeLine XSS 24h"
        unique_id: wazuh_safeline_xss_24h
        availability: >-
          {{ value_json is defined and value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('xss', {}).get('doc_count') is not none }}
        value_template: >-
          {{ value_json.get('aggregations', {}).get('adapter_v1', {}).get('safeline', {}).get('xss', {}).get('doc_count', 0) | int(0) }}
      - name: "Wazuh SafeLine Repeated Attacks 24h"
        unique_id: wazuh_safeline_repeated_attacks_24h
