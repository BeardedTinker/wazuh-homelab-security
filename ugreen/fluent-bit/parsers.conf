[PARSER]
    Name        ugos_syslog_rfc3164
    Format      regex
    Regex       ^(?<time>[A-Z][a-z]{2}\s+[ 0-9][0-9]\s+[0-9]{2}:[0-9]{2}:[0-9]{2})\s+(?<host>\S+)\s+(?<ident>[A-Za-z0-9_./-]+)(?:\[(?<pid>[0-9]+)\])?:\s+(?<message>.*)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Time_Keep   On
