name: Prepare draft release
run-name: Prepare draft release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag selected for this run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag and metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $semver ]]; then
            echo "Release tag is not supported semver: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Run this workflow from tag $RELEASE_TAG, not $GITHUB_REF" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Selected tag does not resolve to workflow commit" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          escaped_version="${version//./\\.}"
          if [[ "$(head -n 1 RELEASE_NOTES.md)" != "# Wazuh Homelab Security $version" ]]; then
            echo "RELEASE_NOTES.md heading does not match $version" >&2
            exit 1
          fi

          if ! grep -Eq "^## \[$escaped_version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated $version release heading" >&2
            exit 1
          fi

          if ! grep -Fq "$RELEASE_TAG" README.md; then
            echo "README.md does not reference $RELEASE_TAG" >&2
            exit 1
          fi

  validation:
    name: Validate tagged release
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  draft-release:
    name: Create draft release
    needs:
      - preflight
      - validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download runtime regression report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wazuh-regression-results-4.14.9
          path: release-assets

      - name: Verify release assets
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report_path = Path("release-assets/wazuh-regression-results.json")
          rows = json.loads(report_path.read_text(encoding="utf-8"))
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Regression report is empty or has an invalid structure")

          counts = Counter(str(row.get("status", "")).upper() for row in rows)
          known = {"PASS", "FAIL", "PENDING", "XPASS", "KNOWN_FAIL"}
          unknown = sorted(status for status in counts if status not in known)
          if unknown:
              raise SystemExit(f"Regression report has unknown statuses: {unknown}")
          if counts["FAIL"] or counts["XPASS"] or counts["KNOWN_FAIL"]:
              raise SystemExit(
                  "Release regression is not clean: "
                  f"FAIL={counts['FAIL']}, XPASS={counts['XPASS']}, "
                  f"KNOWN_FAIL={counts['KNOWN_FAIL']}"
              )
          if not counts["PASS"]:
              raise SystemExit("Regression report contains no passing scenarios")

          print(
              f"PASS={counts['PASS']}, FAIL={counts['FAIL']}, "
              f"PENDING={counts['PENDING']}, XPASS={counts['XPASS']}"
          )
          PY

          (
            cd release-assets
            sha256sum wazuh-regression-results.json \
              > wazuh-regression-results.json.sha256
            sha256sum --check wazuh-regression-results.json.sha256
          )
          sha256sum --check SHA256SUMS

      - name: Create unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            SHA256SUMS \
            release-assets/wazuh-regression-results.json \
            release-assets/wazuh-regression-results.json.sha256
