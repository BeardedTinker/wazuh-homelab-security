        value_template: >-
          {% set buckets = value_json.get('aggregations', {}).get('adapter_v1', {}).get('top_elevated_rule', {}).get('rules', {}).get('buckets', []) %}
          {% if buckets | length > 0 %}
            {% set bucket = buckets[0] %}
            {% set hits = bucket.get('sample', {}).get('hits', {}).get('hits', []) %}
            {% if hits | length > 0 %}
              {% set source = hits[0].get('_source', {}) %}
              {{ source.get('rule', {}).get('description', 'n/a') }} (ID {{ source.get('rule', {}).get('id', bucket.key) }}, {{ bucket.doc_count }}x)
